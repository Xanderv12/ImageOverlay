<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Overlay</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>{{Header}}</h1>

    <div class="image-overlay">
        <div class ="image-container">
            <img class="base-image" src="{{img1}}" alt="Image not found"/>
            <img class="overlay-image" src="{{img2}}" alt="Image not found"/>
        </div>
    </div>

    <label for="temp">Overlay Scale:</label>
    <input type="range" id="range" class = "slider" min="0" max="100" value="0" list="markers" steps="">
    <p>Value: <output id="value"></output></p>

    <datalist id="markers">
        <option value="0"></option>
        <option value="10"></option>
        <option value="20"></option>
        <option value="30"></option>
        <option value="40"></option>
        <option value="50"></option>
        <option value="60"></option>
        <option value="70"></option>
        <option value="80"></option>
        <option value="90"></option>
        <option value="100"></option>
    </datalist>
    <!-- X Position -->
    <!-- <input type="range" id="posX" class = "slider" min="-100" max="100" value="0"> -->
    <!-- Y Position -->
    <!-- <input type="range" id="posY" class= "slider" min="-100" max="100" value="0"> -->
    <script src="main.js"></script>
</body>
</html>
